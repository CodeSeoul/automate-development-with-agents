<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" data-interval="work">
    <h1 class="app-title">Pomodoro</h1>

    <div id="interval-type" aria-live="polite" aria-atomic="true">Work</div>

    <div id="time-remaining">25:00</div>

    <div id="cycle-progress" aria-label="Cycle progress">
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
      <span class="dot" data-index="3"></span>
      <span class="dot" data-index="4"></span>
    </div>

    <div id="controls">
      <button id="btn-start">Start</button>
      <button id="btn-pause" disabled>Pause</button>
      <button id="btn-skip" disabled>Skip</button>
      <button id="btn-reset">Reset</button>
    </div>

    <!-- Visually hidden status region for screen-reader announcements -->
    <div id="status-announce" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
